name: Release (macOS, signed + notarized)

# Triggers on tag push of the shape v0.1.0, v1.2.3, etc.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to upload assets to the auto-created GitHub Release

jobs:
  build:
    name: Build, sign, notarize
    runs-on: macos-14 # Apple Silicon. Switch to macos-13 for Intel-only builds.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # Tauri-action wires every Apple env var below into the bundler:
      # - APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD: imports the .p12 into a
      #   throwaway keychain on the runner.
      # - APPLE_SIGNING_IDENTITY: the certificate's Common Name; used by codesign.
      # - APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID: notarytool credentials.
      # When all are present, the action signs, notarizes, and staples the .app.
      - name: Build, sign, notarize, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MarkTable ${{ github.ref_name }}"
          releaseBody: |
            macOS universal build (Apple Silicon + Intel).
            Signed with Developer ID Application and notarized by Apple.
          releaseDraft: true
          prerelease: false
          # Universal binary covers Apple Silicon + Intel in a single .dmg.
          args: --target universal-apple-darwin
